<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #050505;
            background-image: radial-gradient(circle at top left, #170f36, #050505 50%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        /* 🔥 LOGOUT BUTTON STYLE */
        .logout {
            position: absolute;
            top: 20px;
            right: 25px;
        }

        .logout a {
            text-decoration: none;
        }

        .logout button {
            padding: 8px 18px;
            background: linear-gradient(45deg, #ef4444, #dc2626);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            transition: 0.3s;
        }

        .logout button:hover {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
            transform: scale(1.05);
        }

        .container {
            background: rgba(17, 17, 17, 0.6);
            backdrop-filter: blur(12px);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.15), inset 0 0 20px rgba(99, 102, 241, 0.05);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3), inset 0 0 20px rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.4);
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
            background: linear-gradient(90deg, #a5b4fc, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input[type="file"] {
            margin: 20px 0 30px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ddd;
            width: 100%;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="file"]:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(45deg, #4f46e5, #8b5cf6);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            width: 100%;
        }

        button:hover {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.7);
            transform: scale(1.02);
        }

        a {
            color: #93c5fd;
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            font-weight: 400;
            transition: text-shadow 0.3s, color 0.3s;
        }

        a:hover {
            color: #bfdbfe;
            text-shadow: 0 0 10px rgba(147, 197, 253, 0.8);
        }
    </style>
</head>

<body>

<!-- 🔥 LOGOUT BUTTON -->
<div class="logout">
    <a href="/logout">
        <button>Logout</button>
    </a>
</div>

<div class="container">
    <h2>Upload Invoice</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="invoice_file" required>
        <button type="submit">Analyze</button>
    </form>

    <a href="/dashboard">→ Go to Dashboard</a>
</div>

</body>
</html>
